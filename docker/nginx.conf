# =============================================================================
# Nginx 配置 - 网盘资源搜索引擎
# Web 根目录: /var/www/html/public
# =============================================================================

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /var/www/html/public;
    index        index.php index.html index.htm;

    # 访问日志 / 错误日志
    access_log   /dev/stdout;
    error_log    /dev/stderr;

    # 上传文件大小限制
    client_max_body_size 20m;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 上传目录禁止执行 PHP
    location ~* ^/static/uploads/.*\.(php|php5|phtml|sh|pl|py)$ {
        deny all;
    }

    # 主路由（ThinkPHP 路由重写）
    location / {
        if (!-e $request_filename) {
            rewrite  ^(.*)$  /index.php?s=/$1  last;
            break;
        }
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 超时
        fastcgi_connect_timeout  3s;
        fastcgi_send_timeout     60s;
        fastcgi_read_timeout     60s;

        # 缓冲
        fastcgi_buffering        on;
        fastcgi_buffers          16 16k;
        fastcgi_buffer_size      32k;

        # 安全头
        fastcgi_param  HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param  HTTP_X_REAL_IP $remote_addr;
    }

    # 禁止访问敏感文件
    location ~ /\.(git|env|htaccess|htpasswd|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问 vendor / runtime / app / config / database
    location ~ ^/(vendor|runtime|app|config|database|extend|docs|route)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # gzip
    gzip on;
    gzip_min_length  1k;
    gzip_comp_level  6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";
}
