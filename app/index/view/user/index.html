<section class="user-center">
    {/* 个人资料卡片 */}
    <div class="profile-card">
        {if condition="!empty($user['avatar'])"}
            <img class="profile-avatar" src="{$user.avatar}" alt="{$user.nickname}">
        {else/}
            <div class="profile-avatar" style="display:flex;align-items:center;justify-content:center;background:#eef4ff;color:#2b7cff;font-size:24px;font-weight:700">
                {:mb_substr((string)($user['nickname'] ?? 'U'), 0, 1)}
            </div>
        {/if}
        <div class="profile-info">
            <h2>{$user.nickname}</h2>
            <p>{$user.email}</p>
            <p>注册时间：{$user.create_time|substr=0,10}</p>
        </div>
    </div>

    {/* 积分余额 + 签到 */}
    <div class="credit-balance">
        <div>
            <div class="balance-label">积分余额</div>
            <div class="balance-num">{$balance}</div>
        </div>
        <button type="button" class="btn btn-small" id="sign-in-btn" style="background:rgba(255,255,255,.2);color:#fff;border-color:transparent">每日签到</button>
    </div>

    {/* 导航 */}
    <div class="user-tabs">
        <a href="/user" class="active">个人资料</a>
        <a href="/user/credits">积分流水</a>
        <a href="/user/orders">我的订单</a>
        <a href="/submit/myList">我的提交</a>
        <a href="/order/packages">充值套餐</a>
    </div>

    {/* 编辑资料表单 */}
    <div class="detail-block">
        <h3>编辑资料</h3>
        <form class="form" id="profile-form">
            <div class="form-item">
                <label>昵称</label>
                <input type="text" name="nickname" value="{$user.nickname}" placeholder="请输入昵称">
            </div>
            <div class="form-item">
                <label>头像 URL</label>
                <input type="text" name="avatar" value="{$user.avatar}" placeholder="请输入头像图片地址">
            </div>
            <div>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</section>

<script>
(function () {
    // 每日签到
    var signBtn = document.getElementById('sign-in-btn');
    signBtn.addEventListener('click', async function () {
        signBtn.disabled = true;
        var oldText = signBtn.textContent;
        signBtn.textContent = '签到中...';
        try {
            var res = await App.ajaxPost('/ajax/user/signIn', {});
            if (res.code === 0) {
                App.toast('签到成功 +' + ((res.data && res.data.credit_amount) ? res.data.credit_amount : 0) + ' 积分', 'success');
                setTimeout(function () { location.reload(); }, 1000);
            } else {
                App.toast(res.message || '签到失败', 'error');
            }
        } catch (e) {
            App.toast('网络异常，请重试', 'error');
        }
        signBtn.disabled = false;
        signBtn.textContent = oldText;
    });

    // 编辑资料
    var form = document.getElementById('profile-form');
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var nickname = form.querySelector('[name=nickname]').value.trim();
        var avatar = form.querySelector('[name=avatar]').value.trim();
        var submitBtn = form.querySelector('button[type=submit]');
        submitBtn.disabled = true;
        var oldText = submitBtn.textContent;
        submitBtn.textContent = '保存中...';
        try {
            var res = await App.ajaxPost('/ajax/user/profile', { nickname: nickname, avatar: avatar });
            if (res.code === 0) {
                App.toast('资料更新成功', 'success');
                setTimeout(function () { location.reload(); }, 800);
            } else {
                App.toast(res.message || '更新失败', 'error');
            }
        } catch (e) {
            App.toast('网络异常，请重试', 'error');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
    });
})();
</script>
