<section class="home-hero">
    <h1>网盘资源搜索引擎</h1>
    <form class="home-search" action="/search" method="get">
        <input type="text" name="q" placeholder="输入关键词搜索网盘资源..." autocomplete="off">
        <button type="submit">搜索</button>
    </form>
    <div class="hot-keywords">
        <span class="hot-label">热门搜索：</span>
        <span class="hot-placeholder">热搜词占位</span>
    </div>
</section>

<section class="resource-list">
    <h2>资源列表</h2>
    <div class="resource-placeholder">资源列表占位</div>
</section>
