<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{$csrf_token}">
    <title>网盘资源搜索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
    <link rel="stylesheet" href="__CSS__/main.css?v={$Think.config.pan.asset_version}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="logo" href="/">网盘搜索</a>
        <form class="header-search" action="/search" method="get" role="search">
            <input type="text" name="q" placeholder="搜索资源..." autocomplete="off" aria-label="搜索关键词">
            <button type="submit" aria-label="搜索">搜索</button>
        </form>
        <nav class="user-menu" aria-label="用户导航">
            <a href="/order/packages">套餐</a>
            {if condition="$isLogged"}
                <a href="/user">{$userNickname|htmlspecialchars}</a>
                <a href="/submit">资源提交</a>
                <form method="post" action="/auth/logout" style="display:inline">
                    <input type="hidden" name="_token" value="{$csrf_token}">
                    <button type="submit" class="nav-link">退出</button>
                </form>
            {else/}
                <a href="/auth/login">登录</a>
                <a href="/auth/register">注册</a>
            {/if}
        </nav>
    </div>
</header>

<main class="site-main">
    <div class="container">
        {__CONTENT__}
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; {:date('Y')} 网盘资源搜索引擎</p>
    </div>
</footer>

<div class="float-ad-slot" id="float-ad" aria-hidden="true">广告位占位</div>

<script src="__JS__/common.js?v={$Think.config.pan.asset_version}"></script>
</body>
</html>
