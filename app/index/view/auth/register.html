<section class="auth-page">
    <div class="auth-box" data-reveal>
        <div class="auth-brand" aria-hidden="true">
            <span class="auth-brand-mark"></span>
        </div>
        <h2>注册</h2>
        <p class="auth-subtitle">创建账号开启网盘资源探索</p>
        <form id="register-form" class="auth-form">
            <div class="form-item">
                <label for="reg-email">邮箱</label>
                <input type="email" name="email" id="reg-email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-item">
                <label for="reg-code">验证码</label>
                <div class="code-row">
                    <input type="text" name="code" id="reg-code" placeholder="请输入验证码" required maxlength="6">
                    <button type="button" id="send-code-btn" class="btn btn-code btn-has-send">
                        发送验证码
                    </button>
                </div>
            </div>
            <div class="form-item">
                <label for="reg-nickname">昵称（选填）</label>
                <input type="text" name="nickname" id="reg-nickname" placeholder="请输入昵称">
            </div>
            <button type="submit" class="btn btn-primary btn-submit btn-has-arrow">
                注册
            </button>
            <p class="auth-link">已有账号？<a href="/auth/login">立即登录</a></p>
        </form>
    </div>
</section>

<script>
(function () {
    // 发送验证码 (type=1 注册)
    var sendBtn = document.getElementById('send-code-btn');
    var emailInput = document.getElementById('reg-email');
    App.bindSendCode(sendBtn, function () { return emailInput.value.trim(); }, 1);

    // 注册提交
    var form = document.getElementById('register-form');
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        var code = document.getElementById('reg-code').value.trim();
        if (!email || !code) { App.toast('请填写邮箱和验证码', 'error'); return; }
        var submitBtn = form.querySelector('button[type=submit]');
        submitBtn.disabled = true;
        var oldText = submitBtn.textContent;
        submitBtn.textContent = '注册中...';
        try {
            var res = await App.ajaxPost('/ajax/auth/register', { email: email, code: code });
            if (res.code === 0) {
                App.toast('注册成功', 'success');
                setTimeout(function () { location.href = (res.data && res.data.url) ? res.data.url : '/'; }, 500);
            } else {
                App.toast(res.message || '注册失败', 'error');
            }
        } catch (e) {
            App.toast('网络异常，请重试', 'error');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
    });
})();
</script>
