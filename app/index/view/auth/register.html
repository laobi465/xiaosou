<section class="auth-page">
    <div class="auth-box">
        <h2>注册</h2>
        <form id="register-form" class="auth-form">
            <div class="form-item">
                <label>邮箱</label>
                <input type="email" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-item">
                <label>验证码</label>
                <div class="code-row">
                    <input type="text" name="code" placeholder="请输入验证码" required maxlength="6">
                    <button type="button" id="send-code-btn">发送验证码</button>
                </div>
            </div>
            <div class="form-item">
                <label>昵称</label>
                <input type="text" name="nickname" placeholder="请输入昵称">
            </div>
            <button type="submit" class="btn-submit">注册</button>
            <p class="auth-link">已有账号？<a href="/auth/login">立即登录</a></p>
        </form>
    </div>
</section>
