<section class="auth-page">
    <div class="auth-box">
        <h2>登录</h2>
        <form id="login-form" class="auth-form">
            <div class="form-item">
                <label>邮箱</label>
                <input type="email" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-item">
                <label>验证码</label>
                <div class="code-row">
                    <input type="text" name="code" placeholder="请输入验证码" required maxlength="6">
                    <button type="button" id="send-code-btn">发送验证码</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">登录</button>
            <p class="auth-link">还没有账号？<a href="/auth/register">立即注册</a></p>
        </form>
    </div>
</section>
