<header class="page-head" data-reveal>
    <span class="page-head-mark mark-amber" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">编辑资源</h1>
        <p class="page-subtitle">修改资源信息并保存</p>
    </div>
</header>

<div class="form-panel" data-reveal>
    <form action="/admin/resource/edit/{$vo.id}" method="post" data-action="ajax-form" data-redirect="/admin/resource">
        <div class="form-item">
            <label>标题 <span class="required">*</span></label>
            <input type="text" name="title" value="{$vo.title|htmlspecialchars}" required>
        </div>
        <div class="form-item">
            <label>封面地址</label>
            <input type="text" name="cover" value="{$vo.cover|htmlspecialchars}">
        </div>
        <div class="form-item">
            <label>简介</label>
            <textarea name="intro">{$vo.intro|htmlspecialchars}</textarea>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>资源类型 <span class="required">*</span></label>
                <select name="resource_type">
                    <option value="1" {if condition="$vo.resource_type == 1"}selected{/if}>影视</option>
                    <option value="2" {if condition="$vo.resource_type == 2"}selected{/if}>音乐</option>
                    <option value="3" {if condition="$vo.resource_type == 3"}selected{/if}>软件</option>
                    <option value="4" {if condition="$vo.resource_type == 4"}selected{/if}>文档</option>
                    <option value="5" {if condition="$vo.resource_type == 5"}selected{/if}>图片</option>
                    <option value="6" {if condition="$vo.resource_type == 6"}selected{/if}>压缩包</option>
                    <option value="7" {if condition="$vo.resource_type == 7"}selected{/if}>其他</option>
                </select>
            </div>
            <div class="form-item">
                <label>文件大小（字节）</label>
                <input type="number" name="file_size" value="{$vo.file_size}" min="0">
            </div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>文件格式</label>
                <input type="text" name="file_format" value="{$vo.file_format|htmlspecialchars}">
            </div>
            <div class="form-item">
                <label>状态</label>
                <select name="status">
                    <option value="1" {if condition="$vo.status == 1"}selected{/if}>正常</option>
                    <option value="0" {if condition="$vo.status == 0"}selected{/if}>失效</option>
                    <option value="2" {if condition="$vo.status == 2"}selected{/if}>待审</option>
                    <option value="3" {if condition="$vo.status == 3"}selected{/if}>驳回</option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/resource" class="btn">返回</a>
        </div>
    </form>
</div>
