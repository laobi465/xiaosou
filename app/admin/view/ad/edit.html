<header class="page-head" data-reveal>
    <span class="page-head-mark mark-blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">编辑投放</h1>
        <p class="page-subtitle">修改投放素材信息与上下线状态</p>
    </div>
    <div class="page-head-action">
        <a href="/admin/ad/placements/{$vo.slot_id}" class="btn btn-sm">返回列表</a>
    </div>
</header>

<div class="form-panel" data-reveal>
    <form action="/admin/ad/edit/{$vo.id}" method="post" data-action="ajax-form" data-redirect="/admin/ad/placements/{$vo.slot_id}">
        <div class="form-item">
            <label>投放标题 <span class="required">*</span></label>
            <input type="text" name="title" value="{$vo.title}" required>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>图片地址</label>
                <input type="text" name="image_url" value="{$vo.image_url}">
            </div>
            <div class="form-item">
                <label>跳转链接</label>
                <input type="text" name="link_url" value="{$vo.link_url}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>开始时间</label>
                <input type="text" name="start_at" value="{$vo.start_at}" placeholder="YYYY-MM-DD HH:MM:SS">
            </div>
            <div class="form-item">
                <label>结束时间</label>
                <input type="text" name="end_at" value="{$vo.end_at}" placeholder="YYYY-MM-DD HH:MM:SS">
            </div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>权重</label>
                <input type="number" name="weight" value="{$vo.weight}" min="0">
                <div class="hint">数值越大展示概率越高</div>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select name="status">
                    <option value="1" {if condition="$vo.status == 1"}selected{/if}>上线</option>
                    <option value="0" {if condition="$vo.status == 0"}selected{/if}>下线</option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/ad/placements/{$vo.slot_id}" class="btn">返回</a>
        </div>
    </form>
</div>
