<header class="page-head" data-reveal>
    <span class="page-head-mark mark-blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">编辑敏感词</h1>
        <p class="page-subtitle">修改敏感词内容或调整启用状态</p>
    </div>
    <div class="page-head-action">
        <a href="/admin/sensitive" class="btn btn-sm">返回列表</a>
    </div>
</header>

<div class="form-panel" data-reveal>
    <form action="/admin/sensitive/edit/{$vo.id}" method="post" data-action="ajax-form" data-redirect="/admin/sensitive">
        <div class="form-row">
            <div class="form-item">
                <label>敏感词 <span class="required">*</span></label>
                <input type="text" name="word" value="{$vo.word}" required>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select name="status">
                    <option value="1" {if condition="$vo.status == 1"}selected{/if}>启用</option>
                    <option value="0" {if condition="$vo.status == 0"}selected{/if}>禁用</option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/sensitive" class="btn">返回</a>
        </div>
    </form>
</div>
