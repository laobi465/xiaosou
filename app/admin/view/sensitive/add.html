<header class="page-head" data-reveal>
    <span class="page-head-mark mark-mint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v8"/>
            <path d="M8 12h8"/>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">新增敏感词</h1>
        <p class="page-subtitle">录入需要过滤的关键词，可选择启用或禁用</p>
    </div>
    <div class="page-head-action">
        <a href="/admin/sensitive" class="btn btn-sm">返回列表</a>
    </div>
</header>

<div class="form-panel" data-reveal>
    <form action="/admin/sensitive/add" method="post" data-action="ajax-form" data-redirect="/admin/sensitive">
        <div class="form-row">
            <div class="form-item">
                <label>敏感词 <span class="required">*</span></label>
                <input type="text" name="word" required placeholder="请输入敏感词">
            </div>
            <div class="form-item">
                <label>状态</label>
                <select name="status">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/sensitive" class="btn">返回</a>
        </div>
    </form>
</div>
