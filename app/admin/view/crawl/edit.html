<header class="page-head" data-reveal>
    <span class="page-head-mark mark-amber" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">编辑采集任务</h1>
        <p class="page-subtitle">修改采集任务参数并保存</p>
    </div>
</header>

<div class="form-panel" data-reveal>
    <form action="/admin/crawl/edit/{$vo.id}" method="post" data-action="ajax-form" data-redirect="/admin/crawl">
        <div class="form-item">
            <label>网盘源 ID <span class="required">*</span></label>
            <input type="number" name="pan_source_id" value="{$vo.pan_source_id}" required min="1">
            <div class="hint">可在 <a href="/admin/pan_source" target="_blank">网盘源管理</a> 查看 ID</div>
        </div>
        <div class="form-item">
            <label>任务名称 <span class="required">*</span></label>
            <input type="text" name="name" value="{$vo.name}" required>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>采集频率（秒）<span class="required">*</span></label>
                <input type="number" name="frequency" value="{$vo.frequency}" required min="1">
                <div class="hint">每次采集间隔秒数，如 3600 = 1小时</div>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select name="enabled">
                    <option value="1" {if condition="$vo.enabled == 1"}selected{/if}>启用</option>
                    <option value="0" {if condition="$vo.enabled == 0"}selected{/if}>禁用</option>
                </select>
            </div>
        </div>
        <div class="form-item">
            <label>采集配置（JSON）</label>
            <textarea name="config">{$vo.config}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/crawl" class="btn">返回</a>
        </div>
    </form>
</div>
