<header class="page-head" data-reveal>
    <span class="page-head-mark mark-blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="14" y2="17"></line>
        </svg>
    </span>
    <div class="page-head-text">
        <h1 class="page-title">采集日志 - {$task.name}</h1>
        <p class="page-subtitle">查看该任务的采集执行记录</p>
    </div>
    <a href="/admin/crawl" class="btn btn-sm page-head-action">返回列表</a>
</header>

<form class="toolbar" method="get" action="/admin/crawl/logs/{$task.id}" data-reveal>
    <div class="form-item">
        <select name="status">
            <option value="">全部状态</option>
            <option value="1" {if condition="$status == 1"}selected{/if}>成功</option>
            <option value="0" {if condition="$status === 0 || $status === '0'"}selected{/if}>失败</option>
        </select>
    </div>
    <div class="form-item toolbar-actions">
        <button type="submit" class="btn btn-primary btn-sm">筛选</button>
    </div>
</form>

<div class="table-wrap" data-reveal>
    <table class="table">
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>状态</th>
                <th>发现数</th>
                <th>新增数</th>
                <th>耗时(ms)</th>
                <th>采集时间</th>
            </tr>
        </thead>
        <tbody>
            {foreach $list as $vo}
            <tr>
                <td class="col-id">{$vo.id}</td>
                <td>
                    {if condition="$vo.status == 1"}<span class="badge badge-success">成功</span>
                    {else/}<span class="badge badge-danger">失败</span>
                    {/if}
                </td>
                <td>{$vo.found_count}</td>
                <td>{$vo.new_count}</td>
                <td>{$vo.duration_ms}</td>
                <td class="nowrap text-small text-muted">{$vo.create_time}</td>
            </tr>
            {/foreach}
        </tbody>
    </table>
    {if condition="$list->isEmpty()"}
    <div class="empty">暂无采集日志</div>
    {/if}
</div>
<nav class="pagination" data-reveal>{$list->render()|raw}</nav>
