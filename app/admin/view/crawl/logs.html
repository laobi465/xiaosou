<div class="page-title">
    采集日志 - {$task.name}
    <a href="/admin/crawl" class="btn btn-sm" style="margin-left:12px;">返回列表</a>
</div>

<form class="toolbar" method="get" action="/admin/crawl/logs/{$task.id}">
    <div class="form-item">
        <select name="status">
            <option value="">全部状态</option>
            <option value="1" {if condition="$status == 1"}selected{/if}>成功</option>
            <option value="0" {if condition="$status === 0 || $status === '0'"}selected{/if}>失败</option>
        </select>
    </div>
    <div class="form-item">
        <button type="submit" class="btn btn-primary btn-sm">筛选</button>
    </div>
</form>

<div class="table-wrap">
    <table class="table">
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>状态</th>
                <th>发现数</th>
                <th>新增数</th>
                <th>耗时(ms)</th>
                <th>采集时间</th>
            </tr>
        </thead>
        <tbody>
            {foreach $list as $vo}
            <tr>
                <td class="col-id">{$vo.id}</td>
                <td>
                    {if condition="$vo.status == 1"}<span class="badge badge-success">成功</span>
                    {else/}<span class="badge badge-danger">失败</span>
                    {/if}
                </td>
                <td>{$vo.found_count}</td>
                <td>{$vo.new_count}</td>
                <td>{$vo.duration_ms}</td>
                <td class="nowrap text-small text-muted">{$vo.create_time}</td>
            </tr>
            {/foreach}
        </tbody>
    </table>
    {if condition="$list->isEmpty()"}
    <div class="empty">暂无采集日志</div>
    {/if}
</div>
<div class="pagination">{$list->render()|raw}</div>
