<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="__CSS__/admin.css">
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <span class="sidebar-logo-mark" aria-hidden="true"></span>
            <span class="sidebar-logo-text">后台管理</span>
        </div>
        <nav class="sidebar-menu">
            <a href="/admin">仪表盘</a>
            <a href="/admin/resource">资源管理</a>
            <a href="/admin/pan_source">网盘源</a>
            <a href="/admin/crawl">采集任务</a>
            <a href="/admin/submission">用户提交</a>
            <a href="/admin/user">用户管理</a>
            <a href="/admin/order">订单管理</a>
            <a href="/admin/package">积分套餐</a>
            <a href="/admin/ad">广告管理</a>
            <a href="/admin/config">系统配置</a>
            <a href="/admin/sensitive">敏感词</a>
            <a href="/admin/log">日志查看</a>
        </nav>
    </aside>

    <div class="sidebar-overlay" aria-hidden="true"></div>

    <div class="admin-main">
        <header class="admin-topbar">
            <button class="sidebar-toggle" type="button" aria-label="切换菜单">
                <svg class="sidebar-toggle-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="17" y2="6"></line>
                    <line x1="3" y1="10" x2="17" y2="10"></line>
                    <line x1="3" y1="14" x2="17" y2="14"></line>
                </svg>
            </button>
            <span class="topbar-title">控制台</span>
            <nav class="topbar-nav">
                <a href="/admin/logout">退出</a>
            </nav>
        </header>
        <div class="admin-content">
            {__CONTENT__}
        </div>
    </div>
</div>
<script src="__JS__/admin.js"></script>
</body>
</html>
